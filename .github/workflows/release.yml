name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          make test
          swift test

      - name: Build and self-sign .app bundle
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: make app

      - name: Package .zip, .dmg, and SHA-256 checksums
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          ZIP_NAME="AntigravityUsageMonitor-${APP_VERSION}-macOS-arm64.zip"
          DMG_NAME="AntigravityUsageMonitor-${APP_VERSION}-macOS-arm64.dmg"

          ditto -c -k --sequesterRsrc --keepParent \
            "build/Antigravity Usage Monitor.app" \
            "dist/${ZIP_NAME}"

          chmod +x Scripts/build-dmg.sh
          ./Scripts/build-dmg.sh

          (cd dist && shasum -a 256 "${DMG_NAME}" "${ZIP_NAME}" > SHA256SUMS.txt)
          ls -lh dist/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat <<'EOF' > release-notes.md
          ### Install (macOS 15+ · Apple Silicon)

          - **DMG**: Download `AntigravityUsageMonitor-${VERSION}-macOS-arm64.dmg`, double-click to mount, and drag **Antigravity Usage Monitor.app** into **Applications**.
          - **ZIP**: Download `AntigravityUsageMonitor-${VERSION}-macOS-arm64.zip`, unzip, and move **Antigravity Usage Monitor.app** into `/Applications`.
          - **Homebrew Cask**:
            ```bash
            brew tap panmingxuan/antigravity-usage-monitor https://github.com/panmingxuan/antigravity-usage-monitor
            brew install --cask antigravity-usage-monitor
            ```

          Because this build is self-signed (not notarized by Apple), if macOS Gatekeeper blocks the first launch, run:

          ```bash
          xattr -dr com.apple.quarantine "/Applications/Antigravity Usage Monitor.app"
          ```

          ### 安装说明（macOS 15+ · Apple Silicon）

          - **DMG 安装镜像**：下载 `AntigravityUsageMonitor-${VERSION}-macOS-arm64.dmg`，双击挂载后拖入 `Applications` 文件夹即可。
          - **ZIP 压缩包**：下载 `AntigravityUsageMonitor-${VERSION}-macOS-arm64.zip`，解压后拖入 `/Applications`。
          - **Homebrew Cask**：执行上方两行 `brew` 命令一键安装。
          - 首次打开若系统提示无法验证开发者，执行上方 `xattr` 命令解除隔离即可正常打开。
          EOF
          sed -i '' "s/\${VERSION}/${VERSION}/g" release-notes.md

          gh release create "$TAG" \
            dist/*.dmg \
            dist/*.zip \
            dist/SHA256SUMS.txt \
            --title "Antigravity Usage Monitor ${TAG}" \
            --notes-file release-notes.md
