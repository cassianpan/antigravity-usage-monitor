name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          make test
          swift test

      - name: Build and self-sign .app bundle
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: make app

      - name: Package .zip, .dmg, and SHA-256 checksums
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          ZIP_NAME="AntigravityUsageMonitor-${APP_VERSION}-macOS-arm64.zip"
          DMG_NAME="AntigravityUsageMonitor-${APP_VERSION}-macOS-arm64.dmg"

          ditto -c -k --sequesterRsrc --keepParent \
            "build/Antigravity Usage Monitor.app" \
            "dist/${ZIP_NAME}"

          chmod +x Scripts/build-dmg.sh
          ./Scripts/build-dmg.sh

          (cd dist && shasum -a 256 "${DMG_NAME}" "${ZIP_NAME}" > SHA256SUMS.txt)
          ls -lh dist/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x Scripts/release-notes.sh
          ZIP_SHA="$(grep '\.zip$' dist/SHA256SUMS.txt | awk '{print $1}')"
          if Scripts/release-notes.sh "$VERSION" "$ZIP_SHA" > release-notes.md; then
            gh release create "$TAG" \
              dist/*.dmg \
              dist/*.zip \
              dist/SHA256SUMS.txt \
              --title "Antigravity Usage Monitor ${TAG}" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              dist/*.dmg \
              dist/*.zip \
              dist/SHA256SUMS.txt \
              --title "Antigravity Usage Monitor ${TAG}" \
              --generate-notes
          fi
